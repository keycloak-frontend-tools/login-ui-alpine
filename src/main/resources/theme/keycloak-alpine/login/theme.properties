# Keycloak Alpine Login Theme
# Alpine.js based login theme for Keycloak
#
# This theme extends login-ui-base which provides:
# - FreeMarker templates that serialize context to JSON
# - Page rendering delegated to JavaScript based on pageId
#
# This theme provides:
# - Alpine.js reactive UI components
# - Theme-specific styles
# - Pure HTML templates in pages/ directory

parent=login-ui-base

# Enable embedded HTML templates - pages are loaded from pages/*.html
embeddedTemplates=true

# Enable dark mode support
darkMode=true
kcDarkModeClass=pf-v5-theme-dark

# Common styles from PatternFly
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css

# Theme-specific styles
styles=css/styles.css

# Body class
kcBodyClass=kc-login-alpine

# Login container class
kcLoginClass=kc-login-container

# HTML class
kcHtmlClass=login-pf
