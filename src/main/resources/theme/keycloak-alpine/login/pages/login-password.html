<div class="pf-v5-c-login" x-data="loginPasswordPage">
  <div class="pf-v5-c-login__container">
    <main class="pf-v5-c-login__main">
      <header class="pf-v5-c-login__main-header">
        <h1 class="pf-v5-c-title pf-m-3xl" x-text="$msg('loginAccountTitle')"></h1>
        <template x-if="ctx.auth?.showUsername">
          <div class="pf-v5-c-login__main-header-desc">
            <span x-text="ctx.auth.attemptedUsername"></span>
            <a :href="ctx.url.loginRestartFlowUrl" class="pf-v5-c-button pf-m-link pf-m-inline">
              <i class="fas fa-redo"></i>
            </a>
          </div>
        </template>
      </header>
      
      <div class="pf-v5-c-login__main-body">
        <template x-if="ctx.message && ctx.message.summary && !passwordError">
          <div x-data="kcAlert">
            <div class="pf-v5-c-alert pf-m-inline" :class="alertClass">
              <div class="pf-v5-c-alert__icon">
                <i :class="iconClass"></i>
              </div>
              <p class="pf-v5-c-alert__title" x-html="ctx.message.summary"></p>
            </div>
          </div>
        </template>
        
        <form class="pf-v5-c-form" :action="ctx.url.loginAction" method="post">
          <div class="pf-v5-c-form__group" x-data="kcPasswordField">
            <div class="pf-v5-c-form__group-label">
              <label class="pf-v5-c-form__label" for="password">
                <span class="pf-v5-c-form__label-text" x-text="$msg('password')"></span>
                <span class="pf-v5-c-form__label-required" aria-hidden="true">*</span>
              </label>
            </div>
            <div class="pf-v5-c-form__group-control">
              <div class="pf-v5-c-input-group">
                <div class="pf-v5-c-input-group__item pf-m-fill">
                  <input
                    class="pf-v5-c-form-control"
                    :class="{ 'pf-m-error': passwordError }"
                    :type="inputType"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    autofocus
                    required
                  />
                </div>
                <div class="pf-v5-c-input-group__item">
                  <button type="button" class="pf-v5-c-button pf-m-control" @click="toggle">
                    <i :class="toggleIcon"></i>
                  </button>
                </div>
              </div>
              <template x-if="passwordError">
                <div class="pf-v5-c-form__helper-text pf-m-error">
                  <span x-text="passwordError"></span>
                </div>
              </template>
              <template x-if="ctx.realm.resetPasswordAllowed">
                <div class="pf-v5-c-form__helper-text">
                  <a :href="ctx.url.loginResetCredentialsUrl" x-text="$msg('doForgotPassword')"></a>
                </div>
              </template>
            </div>
          </div>
          
          <input type="hidden" name="credentialId" :value="ctx.auth?.selectedCredential || ''" />
          
          <div class="pf-v5-c-form__group pf-m-action">
            <button class="pf-v5-c-button pf-m-primary pf-m-block" type="submit" x-text="$msg('doLogIn')"></button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
