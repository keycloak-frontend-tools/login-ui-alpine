<div class="pf-v5-c-login" x-data="resetPasswordPage">
  <div class="pf-v5-c-login__container">
    <main class="pf-v5-c-login__main">
      <header class="pf-v5-c-login__main-header">
        <h1 class="pf-v5-c-title pf-m-3xl" x-text="$msg('emailForgotTitle')"></h1>
      </header>
      
      <div class="pf-v5-c-login__main-body">
        <template x-if="ctx.message && ctx.message.summary && !usernameError">
          <div x-data="kcAlert">
            <div class="pf-v5-c-alert pf-m-inline" :class="alertClass">
              <div class="pf-v5-c-alert__icon">
                <i :class="iconClass"></i>
              </div>
              <p class="pf-v5-c-alert__title" x-html="ctx.message.summary"></p>
            </div>
          </div>
        </template>
        
        <p class="pf-v5-c-form__helper-text" x-text="$msg('emailInstruction')"></p>
        
        <form class="pf-v5-c-form" :action="ctx.url.loginAction" method="post">
          <div class="pf-v5-c-form__group">
            <div class="pf-v5-c-form__group-label">
              <label class="pf-v5-c-form__label" for="username">
                <span class="pf-v5-c-form__label-text" x-text="$msg('usernameOrEmail')"></span>
                <span class="pf-v5-c-form__label-required" aria-hidden="true">*</span>
              </label>
            </div>
            <div class="pf-v5-c-form__group-control">
              <input
                class="pf-v5-c-form-control"
                :class="{ 'pf-m-error': usernameError }"
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                autofocus
                required
              />
              <template x-if="usernameError">
                <div class="pf-v5-c-form__helper-text pf-m-error">
                  <span x-text="usernameError"></span>
                </div>
              </template>
            </div>
          </div>
          
          <div class="pf-v5-c-form__group pf-m-action">
            <div class="pf-v5-l-flex">
              <a :href="ctx.url.loginUrl" class="pf-v5-c-button pf-m-secondary" x-text="$msg('backToLogin')"></a>
              <button type="submit" class="pf-v5-c-button pf-m-primary" x-text="$msg('doSubmit')"></button>
            </div>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
