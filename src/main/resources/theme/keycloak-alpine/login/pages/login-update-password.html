<div class="pf-v5-c-login" x-data="updatePasswordPage">
  <div class="pf-v5-c-login__container">
    <main class="pf-v5-c-login__main">
      <header class="pf-v5-c-login__main-header">
        <h1 class="pf-v5-c-title pf-m-3xl" x-text="$msg('updatePasswordTitle')"></h1>
        <template x-if="ctx.auth?.showUsername">
          <div class="pf-v5-c-login__main-header-desc">
            <span x-text="ctx.auth.attemptedUsername"></span>
            <a :href="ctx.url.loginRestartFlowUrl" class="pf-v5-c-button pf-m-link pf-m-inline">
              <i class="fas fa-redo"></i>
            </a>
          </div>
        </template>
      </header>
      
      <div class="pf-v5-c-login__main-body">
        <template x-if="ctx.message && ctx.message.summary">
          <div x-data="kcAlert">
            <div class="pf-v5-c-alert pf-m-inline" :class="alertClass">
              <div class="pf-v5-c-alert__icon">
                <i :class="iconClass"></i>
              </div>
              <p class="pf-v5-c-alert__title" x-html="ctx.message.summary"></p>
            </div>
          </div>
        </template>
        
        <form class="pf-v5-c-form" :action="ctx.url.loginAction" method="post">
          <input type="text" id="username" name="username" :value="ctx.auth?.attemptedUsername || ''" autocomplete="username" readonly hidden />
          
          <div class="pf-v5-c-form__group" x-data="kcPasswordField">
            <div class="pf-v5-c-form__group-label">
              <label class="pf-v5-c-form__label" for="password-new">
                <span class="pf-v5-c-form__label-text" x-text="$msg('passwordNew')"></span>
                <span class="pf-v5-c-form__label-required" aria-hidden="true">*</span>
              </label>
            </div>
            <div class="pf-v5-c-form__group-control">
              <div class="pf-v5-c-input-group">
                <div class="pf-v5-c-input-group__item pf-m-fill">
                  <input
                    class="pf-v5-c-form-control"
                    :class="{ 'pf-m-error': passwordNewError }"
                    :type="inputType"
                    id="password-new"
                    name="password-new"
                    autocomplete="new-password"
                    autofocus
                    required
                  />
                </div>
                <div class="pf-v5-c-input-group__item">
                  <button type="button" class="pf-v5-c-button pf-m-control" @click="toggle">
                    <i :class="toggleIcon"></i>
                  </button>
                </div>
              </div>
              <template x-if="passwordNewError">
                <div class="pf-v5-c-form__helper-text pf-m-error">
                  <span x-text="passwordNewError"></span>
                </div>
              </template>
            </div>
          </div>
          
          <div class="pf-v5-c-form__group" x-data="kcPasswordField">
            <div class="pf-v5-c-form__group-label">
              <label class="pf-v5-c-form__label" for="password-confirm">
                <span class="pf-v5-c-form__label-text" x-text="$msg('passwordConfirm')"></span>
                <span class="pf-v5-c-form__label-required" aria-hidden="true">*</span>
              </label>
            </div>
            <div class="pf-v5-c-form__group-control">
              <div class="pf-v5-c-input-group">
                <div class="pf-v5-c-input-group__item pf-m-fill">
                  <input
                    class="pf-v5-c-form-control"
                    :class="{ 'pf-m-error': passwordConfirmError }"
                    :type="inputType"
                    id="password-confirm"
                    name="password-confirm"
                    autocomplete="new-password"
                    required
                  />
                </div>
                <div class="pf-v5-c-input-group__item">
                  <button type="button" class="pf-v5-c-button pf-m-control" @click="toggle">
                    <i :class="toggleIcon"></i>
                  </button>
                </div>
              </div>
              <template x-if="passwordConfirmError">
                <div class="pf-v5-c-form__helper-text pf-m-error">
                  <span x-text="passwordConfirmError"></span>
                </div>
              </template>
            </div>
          </div>
          
          <div class="pf-v5-c-form__group pf-m-action">
            <div class="pf-v5-l-flex">
              <template x-if="ctx.isAppInitiatedAction">
                <button type="submit" name="cancel-aia" value="true" class="pf-v5-c-button pf-m-secondary" x-text="$msg('doCancel')"></button>
              </template>
              <button type="submit" class="pf-v5-c-button pf-m-primary" x-text="$msg('doSubmit')"></button>
            </div>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
