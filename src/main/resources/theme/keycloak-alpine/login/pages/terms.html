<div class="pf-v5-c-login" x-data="infoPage">
  <div class="pf-v5-c-login__container">
    <main class="pf-v5-c-login__main">
      <header class="pf-v5-c-login__main-header">
        <h1 class="pf-v5-c-title pf-m-3xl">Information</h1>
      </header>
      
      <div class="pf-v5-c-login__main-body">
        <template x-if="ctx.message && ctx.message.summary">
          <div x-data="kcAlert">
            <div class="pf-v5-c-alert pf-m-inline" :class="alertClass">
              <div class="pf-v5-c-alert__icon">
                <i :class="iconClass"></i>
              </div>
              <p class="pf-v5-c-alert__title" x-html="ctx.message.summary"></p>
            </div>
          </div>
        </template>
        
        <template x-if="ctx.client?.baseUrl">
          <div class="pf-v5-c-form__group pf-m-action">
            <a :href="ctx.client.baseUrl" class="pf-v5-c-button pf-m-primary" x-text="$msg('backToApplication')"></a>
          </div>
        </template>
        
        <template x-if="!ctx.client?.baseUrl">
          <div class="pf-v5-c-form__group pf-m-action">
            <a :href="ctx.url.loginUrl" class="pf-v5-c-button pf-m-primary" x-text="$msg('backToLogin')"></a>
          </div>
        </template>
      </div>
    </main>
  </div>
</div>
